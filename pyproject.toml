[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=42"]

[project]
name = "geoclide"
version = "3.0.3"
license = {file = "LICENSE.txt"}
description = "A python package for geometric calculations in the three-dimentional Euclidian space"
authors = [
    {name = "Mustapha Moulana", email="mm@hygeos.com"}
]
readme = "README.md"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'License :: Free for non-commercial use',
    'License :: Other/Proprietary License',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Scientific/Engineering'
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "xarray",
    "pytest",
    "matplotlib",
    "ipympl",
    "ipykernel",
    "netcdf4",
    "trimesh"
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "myst-parser",
    "nbsphinx",
    "numpydoc",
    "jupytext",
    "nbconvert",
]

[project.urls]
Homepage = "https://hygeos.github.io/geoclide/"
Source = "https://github.com/hygeos/geoclide"

[tool.setuptools]
packages = ["geoclide"]

[tool.pyright]
# bare expressions in the notebooks are display outputs
[[tool.pyright.executionEnvironments]]
root = "docs/_notebooks"
extraPaths = ["."]
reportUnusedExpression = false

[tool.ruff]
line-length = 79
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# E402: sys.path must be set before importing geoclide
# B018: bare expressions are notebook display outputs
"docs/conf.py" = ["E402"]
"docs/_notebooks/*.py" = ["E402", "B018"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

# **** pixi configuration ****
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
geoclide = { path = ".", editable = true }

[tool.pixi.dependencies]
pandoc = ">=3.9,<4"

[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }